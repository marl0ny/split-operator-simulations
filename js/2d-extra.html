	<head>
		<!--
			Originally, I had numerous issues trying to get consistent and proper scaling
			on mobile devices. To fix this, it turns out that the viewport through the meta tag 
			needs to be explicitly set to use the device's screen width,
			as this is not done by default. 
			As well as this, some browser specific adjustments need to be turned off.
			I personally found this blog post by S. Sutoris helpful:
			https://www.rismosch.com/article?id=css-on-mobile-and-the-most-important-header-tag
			And of course I looked at the MDN documentation:
			https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport
		-->
        <style>
			body {
				text-size-adjust: none; 
				-moz-text-size-adjust: none;}
            h2 {font-family:Arial, Helvetica, sans-serif; }
            label {font-family:Arial, Helvetica, sans-serif; }
			text {font-family:Arial, Helvetica, sans-serif; }
            @media (orientation: landscape) {
               .outer-div {display: grid; grid-template-columns: 1fr 1fr 1fr; }
               .inner-div1 {grid-column: 1;}
               .inner-div2 {grid-column: 2;}
               .inner-div3 {grid-column: 3; resize: vertical; padding: 10px;}
			   #hoveringColorMap { bottom: 0px }
            }
            @media (orientation: portrait) { 
               .outer-div {display: grid; grid-template-rows: repeat(3, auto); } 
               .inner-div1 {grid-row: 1;}
               .inner-div2 {grid-row: 2;} 
               .inner-div3 {grid-row: 3;} 
            } 
        </style>

		<script>
			{
				let colorMapCanvas = document.getElementById('colorMapCanvas');
				let ctx = colorMapCanvas.getContext('2d');
				let width = colorMapCanvas.width;
				let height = colorMapCanvas.height;

				function argumentToColor(argVal) {
					let maxCol = 1.0;
					let minCol = 50.0/255.0;
					let colRange = maxCol - minCol;
					if (argVal <= Math.PI/3.0 && argVal >= 0.0) {
						return [maxCol,
								minCol + colRange*argVal/(Math.PI/3.0),
								minCol];
					} else if (argVal > Math.PI/3.0 
							   && argVal <= 2.0*Math.PI/3.0) {
						return [
							maxCol - colRange*(argVal - Math.PI/3.0) / 
							(Math.PI/3.0),
							maxCol, minCol];
					} else if (argVal > 2.0*Math.PI/3.0
							   && argVal <= Math.PI){
						return [minCol, maxCol,
								minCol + colRange*(argVal - 2.0*Math.PI/3.0) /
								(Math.PI/3.0)];
					} else if (argVal < 0.0 && argVal > -Math.PI/3.0){
						return [maxCol, minCol,
								minCol - colRange*argVal/(Math.PI/3.0)];
					} else if (argVal <= -Math.PI/3.0 
							   && argVal > -2.0*Math.PI/3.0){
						return [maxCol + (colRange*(argVal + Math.PI/3.0) / 
							    (Math.PI/3.0)),
								minCol, maxCol];
					} else if (argVal <= -2.0*Math.PI/3.0 
							   && argVal >= -Math.PI){
						return [minCol,
								minCol - (colRange*(argVal + 2.0*Math.PI/3.0) /
								(Math.PI/3.0)), 
								maxCol];
					}
					else {
						return [minCol, maxCol, maxCol];
					}
				}

				for (let i = 0; i < width; i++) {
					let [rF, gF, bF] = argumentToColor(
						2.0*Math.PI*(i - width/2.0)/width);
					let r = Number.parseInt(255*rF);
					let g = Number.parseInt(255*gF);
					let b = Number.parseInt(255*bF);
					ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
					ctx.fillRect(i, 0, 1, height);
				}
			}
			document.getElementById("showWavefunctionColorMap").checked = false;
            document.getElementById("showWavefunctionColorMap").addEventListener(
                "input",
                e => document.getElementById("hoveringColorMap").hidden 
                     = !e.target.checked);
		</script>
